name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Authorization model:
# - Trigger is `pull_request` (NOT `pull_request_target`), so GitHub
#   automatically withholds secrets from fork-PR runs. The deploy job
#   would fail closed even if the head.repo filter were misconfigured.
# - The deploy job's `if:` further requires the PR head to live in this
#   same repo. That covers the user's own branches and the Claude Code
#   `claude/*` branches; fork PRs are skipped with no checkout, no build,
#   no Fly call.
# - The deploy job declares `environment: pr-preview`. If the user adds
#   themselves as a required reviewer on that environment in repo
#   settings, every deploy pauses for a one-click approval before the
#   secrets release. Disable the reviewer to remove that gate later.
# - Fork PRs are intentionally unsupported. To preview a fork's code,
#   push it as a branch in this repo (e.g. `review/<author>-<topic>`).

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pr-preview
      url: https://prodzilla-pr-${{ github.event.pull_request.number }}.${{ vars.TAILNET_NAME }}.ts.net/
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: prodzilla-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Validate required configuration
        run: |
          : "${FLY_API_TOKEN:?FLY_API_TOKEN secret missing}"
          : "${FLY_ORG:?FLY_ORG repo variable missing}"
          : "${FLY_REGION:?FLY_REGION repo variable missing}"
          : "${TAILNET_NAME:?TAILNET_NAME repo variable missing}"
          : "${TS_AUTHKEY:?TS_AUTHKEY secret missing}"
        env:
          FLY_ORG: ${{ vars.FLY_ORG }}
          FLY_REGION: ${{ vars.FLY_REGION }}
          TAILNET_NAME: ${{ vars.TAILNET_NAME }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure Fly app exists
        run: |
          if ! flyctl apps show "$FLY_APP" >/dev/null 2>&1; then
            flyctl apps create "$FLY_APP" --org "${{ vars.FLY_ORG }}"
          fi

      - name: Stage Tailscale auth key as Fly secret
        run: |
          flyctl secrets set --app "$FLY_APP" --stage \
            TS_AUTHKEY="${{ secrets.TS_AUTHKEY }}"

      - name: Render fly.toml
        env:
          FLY_REGION: ${{ vars.FLY_REGION }}
        run: |
          envsubst '$FLY_APP $FLY_REGION' \
            < deploy/preview/fly.toml.template > fly.toml
          echo "--- rendered fly.toml ---"
          cat fly.toml

      - name: Deploy
        run: |
          flyctl deploy --remote-only \
            --config fly.toml \
            --app "$FLY_APP"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const app = process.env.FLY_APP;
            const tailnet = process.env.TAILNET_NAME;
            const url = `https://${app}.${tailnet}.ts.net`;
            const marker = '<!-- pr-preview-comment -->';
            const body = [
              marker,
              '### Prodzilla preview deployed',
              '',
              `**Tailnet URL:** ${url}/`,
              '',
              'Try:',
              `- \`${url}/probes\``,
              `- \`${url}/stories\``,
              '',
              'Connect your phone to the same tailnet via the Tailscale app to reach it.',
              'The machine runs continuously while this PR is open (~$2/mo) and is destroyed when the PR closes.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          TAILNET_NAME: ${{ vars.TAILNET_NAME }}

  destroy:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: prodzilla-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy Fly app
        run: |
          if flyctl apps show "$FLY_APP" >/dev/null 2>&1; then
            flyctl apps destroy "$FLY_APP" --yes
          else
            echo "App $FLY_APP does not exist; nothing to destroy."
          fi

      - name: Comment teardown on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const body = `${marker}\n### Prodzilla preview torn down\nFly app \`${process.env.FLY_APP}\` was destroyed when this PR closed.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
